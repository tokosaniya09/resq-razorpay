[project]
name = "resq-pay"
version = "0.1.0"
description = "A payment degradation & revenue-recovery controller (Test Mode)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "razorpay>=1.4",
    "httpx>=0.27",
    "websockets>=12.0",
    "anthropic>=0.34",
    "google-generativeai>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "black>=24.4",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
